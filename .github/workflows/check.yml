name: Check

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    permissions:
      contents: read
    uses: OasisViridis/TheMasterplan/.github/workflows/themasterplan-check.yml@v4.0.0
    with:
      project-check-path: scripts/check.sh
      policy-ref: v4.0.0
