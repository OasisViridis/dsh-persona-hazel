name: Check

on:
  # 不限 base 分支：堆叠 PR（base 是另一个特性分支）也要跑检查，
  # 否则多 change 链在合并前完全没验证。
  pull_request:
    types: [opened, edited, reopened, synchronize]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check
    permissions:
      contents: read
    uses: OasisViridis/TheMasterplan/.github/workflows/themasterplan-check.yml@v4.0.0
    with:
      project-check-path: scripts/check.sh
      policy-ref: v4.0.0
